<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="寶光崇正2027年度全球行事曆">
  <meta name="theme-color" content="#174e75">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="2027全球行事曆">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=20260911-1">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=20260911-1">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=20260911-1">
  <link rel="manifest" href="manifest.webmanifest?v=20260911-1">
  <title>寶光崇正2027年度全球行事曆</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20260911-1">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1>寶光崇正2027年度全球行事曆</h1>
    </div>
    <button id="refreshButton" class="icon-button" type="button" aria-label="重新載入資料">↻ <span>更新資料</span></button>
  </header>

  <main>
    <section class="control-panel" aria-labelledby="filterTitle">
      <div class="control-heading">
        <div>
          <h2 id="filterTitle">選擇要查看的行事曆</h2>
          <p>道務中心仙佛班與共同活動預設開啟，台灣及全球道場可自由搭配。</p>
        </div>
        <div class="bulk-actions total-actions" aria-label="全部分類操作">
          <button id="selectAll" type="button">總全選</button>
          <button id="clearAll" type="button">總取消</button>
        </div>
      </div>

      <div class="region-tabs" role="tablist" aria-label="地區分類">
        <button id="taiwanTab" class="region-tab active" type="button" role="tab" aria-selected="true" data-region="taiwan">台灣</button>
        <button id="globalTab" class="region-tab" type="button" role="tab" aria-selected="false" data-region="global">全球</button>
      </div>

      <div class="region-toolbar">
        <p id="regionDescription">台灣道務中心與各地道場</p>
        <div class="bulk-actions">
          <button id="selectRegion" type="button">本區全選</button>
          <button id="clearRegion" type="button">本區取消</button>
        </div>
      </div>
      <div id="filters" class="filters" aria-live="polite"></div>

      <section class="advanced-search" aria-labelledby="searchTitle">
        <div class="search-heading">
          <div>
            <h3 id="searchTitle">進階關鍵字搜尋</h3>
            <p>僅搜尋目前已勾選分類；最多三個關鍵字，可交叉使用「且」與「或」。</p>
          </div>
          <button id="clearSearch" class="clear-search" type="button">清除搜尋</button>
        </div>
        <div class="search-builder">
          <label class="search-term">
            <span>關鍵字 1</span>
            <input id="keyword1" type="search" placeholder="例如：身心靈" autocomplete="off">
          </label>
          <label class="search-operator">
            <span>條件</span>
            <select id="operator2" aria-label="關鍵字一與二的條件">
              <option value="AND">且 AND</option>
              <option value="OR">或 OR</option>
            </select>
          </label>
          <label class="search-term">
            <span>關鍵字 2</span>
            <input id="keyword2" type="search" placeholder="例如：國高中" autocomplete="off">
          </label>
          <label class="search-operator">
            <span>條件</span>
            <select id="operator3" aria-label="關鍵字二與三的條件">
              <option value="AND">且 AND</option>
              <option value="OR">或 OR</option>
            </select>
          </label>
          <label class="search-term">
            <span>關鍵字 3</span>
            <input id="keyword3" type="search" placeholder="例如：線上" autocomplete="off">
          </label>
        </div>
        <p class="search-rule">檢索規則：AND（且）優先於 OR（或）；搜尋活動名稱、日期、單位、分類與地點。</p>
        <p id="searchSummary" class="search-summary" aria-live="polite"></p>
      </section>
    </section>

    <section class="speech-panel" aria-labelledby="speechTitle">
      <div class="speech-heading">
        <div>
          <h3 id="speechTitle">會議逐日朗讀</h3>
          <p>點選任一日期或事件作為起點，依序朗讀日期、共同核心活動、各單位課程與活動。</p>
        </div>
        <label class="speech-rate">
          <span>語速</span>
          <select id="speechRate" aria-label="朗讀語速">
            <option value="0.8">較慢</option>
            <option value="0.9" selected>自然</option>
            <option value="1">標準</option>
            <option value="1.15">較快</option>
          </select>
        </label>
      </div>
      <div class="speech-actions" aria-label="朗讀控制">
        <button id="speechPrevious" type="button">‹ 上一日</button>
        <button id="speechPlay" class="speech-primary" type="button">▶ 開始朗讀</button>
        <button id="speechPause" type="button" disabled>Ⅱ 暫停</button>
        <button id="speechStop" type="button" disabled>■ 停止</button>
        <button id="speechNext" type="button">下一日 ›</button>
      </div>
      <p id="speechStatus" class="speech-status" aria-live="polite">尚未選擇朗讀起點；按「開始朗讀」將由目前顯示的第一天開始。</p>
    </section>

    <section class="calendar-toolbar" aria-label="月份切換">
      <button id="previousMonth" class="month-button" type="button" aria-label="上一個月">‹</button>
      <div>
        <p id="yearLabel" class="year-label"></p>
        <h2 id="monthLabel"></h2>
      </div>
      <button id="nextMonth" class="month-button" type="button" aria-label="下一個月">›</button>
    </section>

    <div class="column-legend" aria-hidden="true">
      <span>共同核心活動</span>
      <span>各單位課程與活動</span>
    </div>
    <div id="status" class="status">正在讀取最新行事曆…</div>
    <section id="calendar" class="calendar" aria-live="polite"></section>
  </main>

  <footer>資料來源：寶光崇正道務中心 Google 試算表</footer>
  <script src="app.js?v=20260911-6"></script>
</body>
</html>
