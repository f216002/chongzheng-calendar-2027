<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="寶光崇正2027年度全球行事曆">
  <meta name="theme-color" content="#087f8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="2027全球行事曆">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=20260911-1">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=20260911-1">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=20260911-1">
  <link rel="manifest" href="manifest.webmanifest?v=20260911-1">
  <title>寶光崇正2027年度全球行事曆</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20260914-22">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1>寶光崇正2027年度全球行事曆</h1>
    </div>
  </header>

  <div id="floatingSpeechControls" class="floating-speech-controls" role="group" aria-label="懸浮朗讀控制" hidden>
    <button id="floatingSpeechPlay" class="speech-primary" type="button" aria-label="播放" title="播放">▶</button>
    <button id="floatingSpeechPause" type="button" aria-label="暫停" title="暫停">Ⅱ</button>
    <button id="floatingSpeechStop" type="button" aria-label="停止" title="停止">■</button>
  </div>

  <main>
    <div class="top-controls-layout">
      <section class="control-panel" aria-labelledby="filterTitle">
      <div class="control-heading">
        <div class="filter-heading-copy">
          <div class="filter-title-row">
            <h2 id="filterTitle">選擇要查看的行事曆</h2>
            <button id="refreshButton" class="icon-button panel-refresh-button" type="button" aria-label="重新載入資料" title="更新資料">↻ <span>更新資料</span></button>
          </div>
        </div>
      </div>

      <div class="region-top-row">
        <div class="region-tabs" role="tablist" aria-label="地區分類">
          <button id="taiwanTab" class="region-tab active" type="button" role="tab" aria-selected="true" data-region="taiwan">台灣</button>
          <button id="globalTab" class="region-tab" type="button" role="tab" aria-selected="false" data-region="global">全球</button>
        </div>
        <div class="font-size-controls" role="group" aria-label="字體大小">
          <button id="fontSizeDecrease" class="font-size-button" type="button" aria-label="縮小網頁字體" title="縮小字體">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5"></circle>
              <path d="M15.5 15.5 21 21M7.5 10.5h6"></path>
            </svg>
          </button>
          <button id="fontSizeIncrease" class="font-size-button" type="button" aria-label="放大網頁字體" title="放大字體">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5"></circle>
              <path d="M15.5 15.5 21 21M7.5 10.5h6M10.5 7.5v6"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="region-toolbar">
        <p id="regionDescription">台灣道務中心與各地道場</p>
        <div class="region-action-row">
          <div id="filterScrollGuide" class="filter-scroll-guide is-hidden" aria-label="分類選項可左右滑動">
            <button id="filterScrollLeft" class="filter-scroll-arrow" type="button" aria-label="向左查看更多分類">‹</button>
            <div class="filter-scroll-message" aria-hidden="true">
              <span class="filter-scroll-line"></span>
              <span>左右滑</span>
              <span class="filter-scroll-line"></span>
            </div>
            <button id="filterScrollRight" class="filter-scroll-arrow" type="button" aria-label="向右查看更多分類">›</button>
          </div>
          <div class="bulk-actions">
            <button id="selectRegion" type="button">全選</button>
            <button id="clearRegion" type="button">取消</button>
          </div>
        </div>
      </div>
        <div id="filters" class="filters" aria-live="polite"></div>
      </section>

      <div class="utility-panels">
        <section class="speech-panel" aria-labelledby="speechTitle">
          <div class="speech-heading">
            <div>
              <h3 id="speechTitle">會議逐日朗讀</h3>
              <p>點任一事件為起點，或直接從頭播放。</p>
            </div>
          </div>
          <div class="speech-actions" aria-label="朗讀控制">
            <button id="speechPlay" class="speech-primary" type="button" aria-label="播放" title="播放">▶</button>
            <button id="speechPause" type="button" aria-label="暫停" title="暫停" disabled>Ⅱ</button>
            <button id="speechStop" type="button" aria-label="停止" title="停止" disabled>■</button>
          </div>
          <p id="speechStatus" class="speech-status" aria-live="polite"></p>
        </section>

        <section class="advanced-search" aria-labelledby="searchTitle">
          <div class="search-heading">
            <div>
              <h3 id="searchTitle">進階關鍵字搜尋</h3>
            </div>
            <button id="clearSearch" class="clear-search" type="button">清除搜尋</button>
          </div>
          <div class="search-builder">
            <label class="search-term">
              <span>關鍵字 1</span>
              <input id="keyword1" type="search" placeholder="例如：身心靈" autocomplete="off">
            </label>
            <label class="search-operator">
              <span>條件</span>
              <select id="operator2" aria-label="關鍵字一與二的條件">
                <option value="AND">且</option>
                <option value="OR">或</option>
                <option value="EXCLUDED">除</option>
              </select>
            </label>
            <label class="search-term">
              <span>關鍵字 2</span>
              <input id="keyword2" type="search" placeholder="例如：國高中" autocomplete="off">
            </label>
          </div>
        </section>
      </div>
    </div>

    <section class="calendar-toolbar" aria-label="月份切換">
      <button id="previousMonth" class="month-button" type="button" aria-label="上一個月">‹</button>
      <div>
        <p id="yearLabel" class="year-label"></p>
        <h2 id="monthLabel"></h2>
      </div>
      <button id="nextMonth" class="month-button" type="button" aria-label="下一個月">›</button>
    </section>

    <div class="column-legend" aria-hidden="true">
      <span>共同核心活動</span>
      <span>各單位課程與活動</span>
    </div>
    <div id="status" class="status">正在讀取最新行事曆…</div>
    <section id="calendar" class="calendar" aria-live="polite"></section>
  </main>

  <footer>資料來源：寶光崇正道務中心 Google 試算表</footer>
  <script src="app.js?v=20260914-7"></script>
</body>
</html>
